bio: |
  I am a Research Scientist at the Institute for Intelligent Networked Systems, Northeastern University, Boston.
  My research focuses on AI-native and optimization-driven design of large-scale wireless systems,
  developing principled and data-driven methods for resource allocation, network orchestration, and
  performance modeling, with a particular emphasis on Open RAN architectures.
  I received my Ph.D. from the Indian Institute of Technology Palakkad.

