bio: |
  I am a Research Scientist at the Institute for Intelligent Networked Systems, Northeastern University. My research lies at the intersection of **wireless networking, optimization, and artificial intelligence**, with a focus on intelligent resource management, network automation, and programmable 5G/6G systems.

  My work combines algorithmic approaches with experimental validation on Open RAN platforms. I received my Ph.D. in Computer Science and Engineering from IIT Palakkad, India.

